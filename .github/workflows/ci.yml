name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra cache --group test
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra cache --group test
      - run: uv run pyright
        env:
          APP_ENV: development
          OPENAI_API_KEY: sk-dummy
          JWT_SECRET_KEY: ci-secret
          ADMIN_API_KEY: ci-admin-key
          INTERNAL_API_KEY: ci-internal-key

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --frozen --extra cache --group test
      # Only unit tests — API/integration tests need Postgres + RabbitMQ
      - run: uv run pytest tests/unit/ -v -q
        env:
          APP_ENV: test
          OPENAI_API_KEY: sk-dummy
          JWT_SECRET_KEY: ci-secret
          ADMIN_API_KEY: ci-admin-key
          INTERNAL_API_KEY: ci-internal-key

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agent-production:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
