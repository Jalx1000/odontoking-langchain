[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/scripts/docker-entrypoint.sh /app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
